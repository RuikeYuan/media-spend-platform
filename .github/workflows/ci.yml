name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Run the pipeline on sample data (fails the build on error-level DQ checks)
        run: |
          python -m msp.pipeline generate --late
          python -m msp.pipeline run
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: data/reports/latest.html
